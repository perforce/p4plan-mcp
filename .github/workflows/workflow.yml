name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Fail the build on high/critical advisories in the dependencies we ship
      # (dist/ runtime deps). Dev-only tooling is excluded via --omit=dev.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
