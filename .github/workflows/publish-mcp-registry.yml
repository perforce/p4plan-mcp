name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to publish from (defaults to the default branch)'
        required: false
        default: ''

jobs:
  publish-mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Sync server.json version with package.json
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          jq --arg v "$PKG_VERSION" '
            .version = $v
            | .packages[0].version = $v
            | del(.packages[1].version)
            | .packages[1].identifier = ("docker.io/perforce/p4plan-mcp:" + $v)
          ' server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate to MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP registry
        run: ./mcp-publisher publish
